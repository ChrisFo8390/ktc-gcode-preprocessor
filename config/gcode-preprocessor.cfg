# G-code Preprocessor Configuration
# This file contains default settings for the G-code preprocessing system
# Keep all [gcode_preprocessor ...] sections in this file: Klipper reads it via
# [include], the Moonraker upload hook reads only this file.

[gcode_preprocessor]
# Enable/disable the entire preprocessing system
enabled: True

# List of processors to run (comma-separated)
# Processors will run in the order they are listed
processors: token_replacer, idle_tool_shutdown


# ==============================================================================
# Token Replacer Processor
# Extracts slicer metadata from G-code comments and replaces token placeholders
#
# Placeholder syntax:
#   !placeholder!   - Built-in placeholders (tool_count, colors, materials, etc.)
#   !!slicer_key!!  - Any slicer config value from "; key = value" comments
#
# Example usage in print_start:
#   PRINT_START TOOLS=!tool_count! BED=!!curr_bed_type!! NOZZLE=!!nozzle_diameter!!
#
# Available built-in placeholders:
#   !tool_count!        - Number of unique tools used
#   !tools!             - Comma-separated list of tool numbers
#   !referenced_tools!  - Same as !tools!
#   !total_toolchanges! - Total number of tool change commands
#   !colors!            - Comma-separated filament colors (parsed from CSV)
#   !materials!         - Comma-separated filament types (parsed from CSV)
#   !temperatures!      - Comma-separated nozzle temperatures (parsed from CSV)
#   !filament_names!    - Comma-separated filament setting names (parsed from CSV)
#
# Generic !!key!! placeholders work with any slicer comment in format:
#   ; key = value
# Examples: !!curr_bed_type!!, !!layer_height!!, !!nozzle_diameter!!, etc.
# ==============================================================================
# [gcode_preprocessor token_replacer]
# extract_tools: True
# extract_colors: True
# extract_materials: True
# extract_temperatures: True
# extract_purge_volumes: False
# extract_filament_names: False
# extract_slicer_config: True
# replace_placeholders: True
# # Replace ';' with ',' and drop '#' in !!key!! values (Klipper would cut the line)
# sanitize_generic_values: True


# ==============================================================================
# Idle Tool Shutdown Processor
# Automatically shuts down tools after their last usage OR when idle for too long
# ==============================================================================
# [gcode_preprocessor idle_tool_shutdown]
# # Idle timeout feature (optional, set to 0 to disable)
# # Minutes of idle time before shutting down tool (0 = disabled)
# idle_timeout_minutes: 0
#
# # End-of-use feature (always enabled)
# # Comma-separated list of tools to exclude (e.g., "0,1")
# # exclude_tools:
#
# # Time estimation settings (only used if idle_timeout_minutes > 0)
# # Initial feedrate in mm/min before F parameter is seen
# # initial_feedrate: 3000
#
# # Tool number -> Klipper heater name. Mapped tools are shut down with
# # SET_HEATER_TEMPERATURE instead of M104 T<n> (which always targets
# # extruder<n>). Needed when G-code tool numbers differ from extruder index.
# # tool_heaters: 0=extruder, 1=extruder1, 2=extruder2, 3=extruder3, 4=extruder4


