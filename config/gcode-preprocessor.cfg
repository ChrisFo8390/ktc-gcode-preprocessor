# G-code Preprocessor Configuration
# This file contains default settings for the G-code preprocessing system
# Keep all [gcode_preprocessor ...] sections in this file: Klipper reads it via
# [include], the Moonraker upload hook reads only this file.

# _KTC_TOOL_SUMMARY macro used by the tool_summary processor
# (tool-summary.cfg is linked into this directory by install.sh)
[include tool-summary.cfg]

[gcode_preprocessor]
# Enable/disable the entire preprocessing system
enabled: True

# List of processors to run (comma-separated)
# Processors will run in the order they are listed
# token_replacer has to come before tool_summary (it provides the slicer data)
processors: token_replacer, idle_tool_shutdown, tool_summary


# ==============================================================================
# Token Replacer Processor
# Extracts slicer metadata from G-code comments and replaces token placeholders
#
# Placeholder syntax:
#   !placeholder!   - Built-in placeholders (tool_count, colors, materials, etc.)
#   !!slicer_key!!  - Any slicer config value from "; key = value" comments
#
# Example usage in print_start:
#   PRINT_START TOOLS=!tool_count! BED=!!curr_bed_type!! NOZZLE=!!nozzle_diameter!!
#
# Available built-in placeholders:
#   !tool_count!        - Number of unique tools used
#   !tools!             - Comma-separated list of tool numbers
#   !referenced_tools!  - Same as !tools!
#   !total_toolchanges! - Total number of tool change commands
#   !colors!            - Comma-separated filament colors (parsed from CSV)
#   !materials!         - Comma-separated filament types (parsed from CSV)
#   !temperatures!      - Comma-separated nozzle temperatures (parsed from CSV)
#   !filament_names!    - Comma-separated filament setting names (parsed from CSV)
#
# Generic !!key!! placeholders work with any slicer comment in format:
#   ; key = value
# Examples: !!curr_bed_type!!, !!layer_height!!, !!nozzle_diameter!!, etc.
# ==============================================================================
# [gcode_preprocessor token_replacer]
# extract_tools: True
# extract_colors: True
# # Color per tool: filament (filament_colour) or extruder (extruder_colour);
# # the other one only fills empty entries
# color_source: filament
# extract_materials: True
# extract_temperatures: True
# extract_purge_volumes: False
# extract_filament_names: False
# extract_slicer_config: True
# replace_placeholders: True
# # Replace ';' with ',' and drop '#' in !!key!! values (Klipper would cut the line)
# sanitize_generic_values: True


# ==============================================================================
# Idle Tool Shutdown Processor
# Automatically shuts down tools after their last usage OR when idle for too long
# ==============================================================================
# [gcode_preprocessor idle_tool_shutdown]
# # Idle timeout feature (optional, set to 0 to disable)
# # Minutes of idle time before shutting down tool (0 = disabled)
# idle_timeout_minutes: 0
#
# # End-of-use feature (always enabled)
# # Comma-separated list of tools to exclude (e.g., "0,1")
# # exclude_tools:
#
# # Time estimation settings (only used if idle_timeout_minutes > 0)
# # Initial feedrate in mm/min before F parameter is seen
# # initial_feedrate: 3000
#
# # Tool number -> Klipper heater name. Mapped tools are shut down with
# # SET_HEATER_TEMPERATURE instead of M104 T<n> (which always targets
# # extruder<n>). Needed when G-code tool numbers differ from extruder index.
# # tool_heaters: 0=extruder, 1=extruder1, 2=extruder2, 3=extruder3, 4=extruder4


# ==============================================================================
# Tool Summary Processor
# Inserts _KTC_TOOL_SUMMARY right before the print start macro. The macro
# prints used tools, nozzle temperatures (first layer if different) and the
# filament color as colored swatch + hex code to the Mainsail/Fluidd console.
# ==============================================================================
# [gcode_preprocessor tool_summary]
# # Print start macro(s) to insert the summary in front of (comma-separated)
# print_start_macros: PRINT_START, START_PRINT
# # Macro that prints the summary (see tool-summary.cfg)
# summary_macro: _KTC_TOOL_SUMMARY


# ==============================================================================
# Heat Stats Processor
# Measures per tool how long the printer stands still at tool changes waiting
# for the nozzle temperature and prints a suggested slicer preheat time and
# standby temperature at the end of the print (KTC_HEAT_STATS shows it any time).
# Add heat_stats to processors above; this section is optional.
# ==============================================================================
# [gcode_preprocessor heat_stats]
# # Insert the report marker at the end of the file
# insert_report: True
# # Sampling interval in seconds
# sample_interval: 0.2
# # Nozzle counts as at temperature within this many degrees
# temp_tolerance: 1
# # Seconds added to the suggested preheat time
# margin: 3
# # Factor applied to the measured heat rate for the standby suggestion
# safety_factor: 0.9
# # Seconds until a preheated tool that is never selected is dropped
# track_timeout: 900
# # Each report is appended here (JSON lines); empty = off
# history_file: ~/printer_data/logs/ktc_heat_stats.jsonl
# # Tool number -> Klipper heater name, if not found via [tool Tn] / extruder<n>
# # tool_heaters: 0=extruder, 1=extruder1, 2=extruder2, 3=extruder3, 4=extruder4


# ==============================================================================
# Tool Prepare Processor (add tool_prepare after token_replacer to processors)
# Call KTC_PREPARE_TOOLS in PRINT_START after homing, before the initial tool
# and purge line: loads (AFC), purges, brushes and retracts the tools of the print.
# ==============================================================================
# [gcode_preprocessor tool_prepare]
# # Seconds between starting the tool heaters
# heat_stagger: 10
# # Tools heating up at the same time (0 = no limit)
# max_heating: 3
# # Temperature of prepared tools until their first use
# standby_temp: 0
# # Abort the print if a needed AFC lane has no filament
# abort_on_empty: True
# # Also purge an initial tool that is already loaded
# purge_initial: False
# # Retraction speed in mm/s; retract_length overrides the slicer value
# retract_speed: 35
# # retract_length: 10
