# KTC G-code Preprocessor - tool summary macro
#
# Called by the tool_summary processor right before PRINT_START, e.g.
#   _KTC_TOOL_SUMMARY TOOLS=0,2 TEMPS=220,250 FIRST_TEMPS=225,255 COLORS=FF0000,00AEEF
# and prints one console line per tool with its nozzle temperature and a
# color swatch plus the hex code in the filament color. Mainsail and Fluidd
# render the HTML; other consoles (KlipperScreen, klippy.log) show it as text.
#
# This file is linked from the repository by install.sh and replaced by
# updates. To customize the output, copy the macro to your own config under a
# different name and set summary_macro in [gcode_preprocessor tool_summary].
#
# Note: Klipper treats '#' as a comment in config files, so the macro builds
# '#', ';' and the degree sign with the escapes "\x23", "\x3b" and "\xb0".

[gcode_macro _KTC_TOOL_SUMMARY]
description: Console summary of tools, temperatures and filament colors (ktc-gcode-preprocessor)
gcode:
    {% set hash = "\x23" %}
    {% set semi = "\x3b" %}
    {% set deg = "\xb0C" %}
    {% set tools = (params.TOOLS|default("")|string).split(",") %}
    {% set temps = (params.TEMPS|default("")|string).split(",") %}
    {% set first_temps = (params.FIRST_TEMPS|default("")|string).split(",") %}
    {% set colors = (params.COLORS|default("")|string).split(",") %}
    {% set lines = ["KTC tool summary: " ~ (tools|select|list|length) ~ " tool(s)"] %}
    {% for i in range(tools|length) if tools[i] %}
        {% set temp = temps[i] if i < temps|length and temps[i] else "?" %}
        {% set first = first_temps[i] if i < first_temps|length and first_temps[i] else "" %}
        {% set color = colors[i] if i < colors|length and colors[i] else "" %}
        {% set line = "T" ~ tools[i] ~ ": " ~ temp ~ " " ~ deg %}
        {% if first and first != temp %}
            {% set line = line ~ " (first layer " ~ first ~ " " ~ deg ~ ")" %}
        {% endif %}
        {% if color %}
            {% set swatch = "<span style=\"display:inline-block" ~ semi ~ "width:1.6em" ~ semi
                ~ "height:0.9em" ~ semi ~ "vertical-align:middle" ~ semi
                ~ "border:1px solid gray" ~ semi ~ "background-color:" ~ hash ~ color ~ "\"></span>" %}
            {% set code = "<span style=\"color:" ~ hash ~ color ~ "\">" ~ hash ~ color ~ "</span>" %}
            {% set line = line ~ "   " ~ swatch ~ " " ~ code %}
        {% else %}
            {% set line = line ~ "   (no color)" %}
        {% endif %}
        {% set _ = lines.append(line) %}
    {% endfor %}
    {action_respond_info(lines|join("\n"))}
